<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اليقين</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="app">

    <header class="app-header">
      <h1>اليقين</h1>
      <p>نظام إدارة وحفظ البيانات</p>
    </header>

    <section class="welcome-card">
      <h2>مرحباً بك في اليقين</h2>
      <p>
        نظام متكامل لحفظ وتنظيم بيانات الأشخاص والمنشآت
      </p>
    </section>

    <section class="stats">

      <div class="stat-card">
        <span>👤</span>
        <strong id="peopleCount">0</strong>
        <small>الأشخاص</small>
      </div>

      <div class="stat-card">
        <span>🏢</span>
        <strong id="facilityCount">0</strong>
        <small>المنشآت</small>
      </div>

      <div class="stat-card">
        <span>📋</span>
        <strong id="totalCount">0</strong>
        <small>إجمالي السجلات</small>
      </div>

    </section>

    <section class="actions">

      <button onclick="addPerson()">
        <span>👤</span>
        <b>إضافة شخص</b>
      </button>

      <button onclick="addFacility()">
        <span>🏢</span>
        <b>إضافة منشأة</b>
      </button>

    </section>

    <section class="recent">

      <div class="section-title">
        <h2>آخر السجلات</h2>
      </div>

      <div id="recordsList">
        <p class="empty">
          لا توجد سجلات حتى الآن
        </p>
      </div>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
